
services:
  flask:
    build: .
    container_name: planner_flask
    ports:
      - 5000:5000
    env_file:
      - .env
    environment:
      - FLASK_ENV=development
    volumes:
      - ./app:/app
    depends_on:
      - mysql
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    container_name: planner_mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: BookEZDatabase
      MYSQL_USER: app_user
      MYSQL_PASSWORD: app_pass
    ports:
      - 3308:3308
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      # swap init.sql to init - 100 rooms.sql for testing req 12
    restart: unless-stopped

volumes:
  mysql_data:
