{% extends 'base.html' %}

{% block title %}Login{% endblock %}

{% block content %}


<div class=" d-flex px-5 flex-wrap align-middle gap-5">
    <div class="card p-5 mx-auto gap-2 d-flex" style="width: 35rem;">
        <h4 class="fw-bold">Login to BookEZ</h4>
        <form method="POST" action="/login">
            <label for="username" class="form-label">Username</label>
            <div class="input-group mb-3">
                <input type="text" class="form-control border border-primary" placeholder="username"
                    aria-label="Enter your username" aria-describedby="basic-addon1" id="username" name="username">
            </div>
            <label for="password" class="form-label">Password</label>
            <div class="input-group mb-3">
                <input type="password" class="form-control border border-primary" placeholder="password"
                    aria-label="Enter your password" aria-describedby="basic-addon1" id="password" name="password">
            </div>
            <div class="row d-flex">
                <div class="col">
                    <button type="submit" class="btn btn-primary me-auto mt-3 d-flex"
                        style="width: 10rem; display: flex;" name="submit">
                        Login
                        <i class="bi bi-arrow-right ms-auto"></i>
                    </button>
                </div>
        </form>
        <div class="col ms-auto">

            <a href="/register" style="width: 10rem; display: flex;" class="btn btn-outline-primary mt-3 ms-auto"
                name="register">
                Register
                <i class="bi bi-arrow-right ms-auto"></i>
            </a>
        </div>
    </div>
</div>
</div>



{% endblock %}
